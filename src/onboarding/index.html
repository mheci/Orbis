<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="onboardingTitle">Welcome to Orbis</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body class="onboarding-body">
    <div class="onboarding-container">
      <header class="onboarding-header">
        <img src="../icons/icon-96.png" width="72" height="72" alt="" />
        <h1 data-i18n="onboardingTitle">Welcome to Orbis</h1>
        <p data-i18n="onboardingSubtitle">
          Keep Google in its own orbit. Private, fast, invisible.
        </p>
      </header>

      <div class="onboarding-progress">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 25%"></div>
        </div>
        <span id="progress-text">Step 1 of 4</span>
      </div>

      <main id="onboarding-content">
        <section class="onboarding-step active" data-step="1">
          <h2 data-i18n="onboardingStep1Title">What is Orbis?</h2>
          <p data-i18n-html="onboardingStep1Body"></p>
          <p data-i18n="onboardingStep1Body2"></p>
          <div class="example-box">
            <div>
              <strong data-i18n="onboardingOrbitTitle">Isolated orbit</strong>
              <p data-i18n="onboardingOrbitBody"></p>
            </div>
          </div>
        </section>

        <section class="onboarding-step" data-step="2">
          <h2 data-i18n="onboardingStep2Title">Fastest way to use it</h2>
          <p data-i18n="onboardingStep2Body"></p>
          <div class="hotkey-demo">
            <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>O</kbd>
            <span data-i18n="onboardingHotkey1Desc"></span>
          </div>
          <div class="hotkey-demo secondary">
            <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>G</kbd>
            <span data-i18n="onboardingHotkey2Desc"></span>
          </div>
          <p class="hint" data-i18n="onboardingShortcutsHint"></p>
          <div class="example-box">
            <div>
              <strong data-i18n="onboardingMouseTitle">Or use your mouse</strong>
              <p data-i18n-html="onboardingMouseBody"></p>
            </div>
          </div>
        </section>

        <section class="onboarding-step" data-step="3">
          <h2 data-i18n="onboardingStep3Title">Blocks trackers automatically</h2>
          <p data-i18n="onboardingStep3Body"></p>
          <div class="cleanup-visual">
            <div class="cleanup-item">
              <span data-i18n="onboardingCleanupAnalytics"></span>
              <span class="check" data-i18n="onboardingBlocked">Blocked</span>
            </div>
            <div class="cleanup-item">
              <span data-i18n="onboardingCleanupAds"></span>
              <span class="check" data-i18n="onboardingBlocked">Blocked</span>
            </div>
            <div class="cleanup-item">
              <span data-i18n="onboardingCleanupSocial"></span>
              <span class="check" data-i18n="onboardingBlocked">Blocked</span>
            </div>
            <div class="cleanup-item">
              <span data-i18n="onboardingCleanupFonts"></span>
              <span class="check" data-i18n="onboardingAllowed">Allowed</span>
            </div>
          </div>
          <p class="hint" data-i18n="onboardingStep3Hint"></p>
        </section>

        <section class="onboarding-step" data-step="4">
          <h2 data-i18n="onboardingStep4Title">You're ready!</h2>
          <p data-i18n="onboardingStep4Body"></p>
          <p data-i18n="onboardingStep4Body2"></p>
          <div class="final-actions">
            <button id="try-orbis" class="button primary large" data-i18n="onboardingTryOrbis">
              Open Google in Orbis
            </button>
            <button
              id="open-dashboard"
              class="button secondary"
              data-i18n="onboardingOpenDashboard"
            >
              Open dashboard
            </button>
          </div>
          <p class="hint" data-i18n="onboardingTip"></p>
        </section>
      </main>

      <footer class="onboarding-footer">
        <button id="prev-step" class="button secondary" disabled data-i18n="onboardingBack">
          Back
        </button>
        <div class="footer-dots">
          <span class="dot active" data-step="1"></span>
          <span class="dot" data-step="2"></span>
          <span class="dot" data-step="3"></span>
          <span class="dot" data-step="4"></span>
        </div>
        <button id="next-step" class="button primary" data-i18n="onboardingNext">Next</button>
      </footer>
    </div>
    <script src="onboarding.js" type="module"></script>
  </body>
</html>
