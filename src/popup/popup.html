<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbis</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-body">
    <header class="head">
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="mark-plate" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6858ff" />
            <stop offset="1" stop-color="#2a1c96" />
          </linearGradient>
          <linearGradient id="mark-orb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0eeff" />
            <stop offset="1" stop-color="#c6bfff" />
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#mark-plate)" />
        <g transform="rotate(-24 256 256)">
          <ellipse
            cx="256"
            cy="256"
            rx="184"
            ry="77"
            fill="none"
            stroke="#22e9db"
            stroke-width="21"
          />
        </g>
        <circle cx="256" cy="256" r="110" fill="url(#mark-orb)" />
        <ellipse cx="210" cy="196" rx="60" ry="42" fill="#ffffff" opacity="0.35" />
        <g transform="rotate(-24 256 256)">
          <path
            d="M 72 256 A 184 77 0 0 1 440 256"
            fill="none"
            stroke="#22e9db"
            stroke-width="21"
          />
          <circle cx="164" cy="323" r="22" fill="#22e9db" />
        </g>
      </svg>
      <div class="head-titles">
        <h1>Orbis</h1>
        <span class="status-pill">
          <span class="dot" id="statusDot" aria-hidden="true"></span>
          <span id="statusText" class="status-text">—</span>
        </span>
      </div>
      <button
        id="openOptions"
        class="icon-btn"
        data-i18n-title="popupOpenSettings"
        data-i18n-aria-label="popupOpenSettings"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
    </header>

    <section class="card site-card" aria-live="polite">
      <div class="site-head">
        <p class="label" data-i18n="popupCurrentSite">Current site</p>
        <span class="verdict" id="verdict" data-i18n="popupChecking">Checking…</span>
      </div>
      <p class="host" id="host">—</p>
    </section>

    <section class="card">
      <div class="row">
        <svg
          class="row-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 7h16v13H4z" />
          <path d="M2 7l10-4 10 4" />
          <path d="M9 13h6" />
        </svg>
        <span class="label" data-i18n="popupContainer">Container</span>
        <span class="value" id="containerName">—</span>
      </div>
      <div class="row">
        <svg
          class="row-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 9h18" />
        </svg>
        <span class="label" data-i18n="popupThisTab">This tab</span>
        <span class="value" id="tabState">—</span>
      </div>
    </section>

    <section class="actions">
      <div class="action-row">
        <button id="moveIn" class="btn primary" data-i18n="popupMoveIn">
          Move tab into container
        </button>
        <button id="moveOut" class="btn" data-i18n="popupMoveOut">Move tab out of container</button>
      </div>
      <div class="action-row">
        <button id="always" class="btn subtle" data-i18n="popupAlways">
          Always containerize this site
        </button>
        <button id="never" class="btn subtle" data-i18n="popupNever">
          Never containerize this site
        </button>
      </div>
    </section>

    <section class="card block-card" id="blockCard">
      <div class="row">
        <span class="label" data-i18n="popupBlockedOnPage">Blocked on this page</span>
        <span class="value count" id="blockedHere">0</span>
      </div>
      <p class="hint" id="blockHint" data-i18n="popupBlockedHint">
        Google trackers stopped before they loaded.
      </p>
      <button id="allowSite" class="btn subtle" data-i18n="popupAllowSite">
        Allow Google resources on this site
      </button>
    </section>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" id="statContained">0</span>
        <span class="stat-label" data-i18n="popupContained">Contained</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statReleased">0</span>
        <span class="stat-label" data-i18n="popupReleased">Released</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statBlocked">0</span>
        <span class="stat-label" data-i18n="popupTrackersBlocked">Trackers blocked</span>
      </div>
    </section>

    <footer class="foot">
      <button id="pause" class="btn danger" data-i18n="popupPause30">Pause 30 min</button>
      <button id="resume" class="btn primary hidden" data-i18n="popupResume">
        Resume protection
      </button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
