<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbis</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="dot" id="statusDot" aria-hidden="true"></span>
      <img src="../icons/icon-16.png" width="16" height="16" alt="" />
      <h1>Orbis</h1>
      <button id="openOptions" class="icon-btn" title="Open settings" aria-label="Open settings">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
    </header>

    <section class="card" aria-live="polite">
      <p class="label">Current site</p>
      <p class="host" id="host">—</p>
      <p class="verdict" id="verdict">Checking…</p>
    </section>

    <section class="card">
      <div class="row">
        <span class="label">Protection</span>
        <span class="value" id="statusText">—</span>
      </div>
      <div class="row">
        <span class="label">Container</span>
        <span class="value" id="containerName">—</span>
      </div>
      <div class="row">
        <span class="label">This tab</span>
        <span class="value" id="tabState">—</span>
      </div>
    </section>

    <section class="actions">
      <button id="moveIn" class="btn primary">Move tab into container</button>
      <button id="moveOut" class="btn">Move tab out of container</button>
      <button id="always" class="btn subtle">Always containerize this site</button>
      <button id="never" class="btn subtle">Never containerize this site</button>
    </section>

    <section class="card" id="blockCard">
      <div class="row">
        <span class="label">Blocked on this page</span>
        <span class="value" id="blockedHere">0</span>
      </div>
      <p class="hint" id="blockHint">Google trackers stopped before they loaded.</p>
      <button id="allowSite" class="btn subtle">Allow Google resources on this site</button>
    </section>

    <section class="card">
      <div class="row">
        <span class="label">Contained</span>
        <span class="value" id="statContained">0</span>
      </div>
      <div class="row">
        <span class="label">Released</span>
        <span class="value" id="statReleased">0</span>
      </div>
      <div class="row">
        <span class="label">Trackers blocked</span>
        <span class="value" id="statBlocked">0</span>
      </div>
    </section>

    <footer class="foot">
      <button id="pause" class="btn danger">Pause 30 min</button>
      <button id="resume" class="btn hidden">Resume protection</button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
