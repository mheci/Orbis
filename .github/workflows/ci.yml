name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository link hygiene
        run: node scripts/check-links.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node == '20'
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build, verify & package
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify manifest, domain JSON and repository links
        run: npm run verify

      - name: Package
        run: npm run package

      - name: Reproducibility check — build twice, hashes must match
        # Deterministic builds are a release requirement: the artifact a
        # maintainer signs locally must be byte-identical to what CI produced
        # from the same commit. npm run package rebuilds dist from scratch, so
        # a second invocation must yield an identical zip.
        run: |
          cp web-ext-artifacts/*.zip "$RUNNER_TEMP/first.zip"
          npm run package
          sha256sum web-ext-artifacts/*.zip "$RUNNER_TEMP/first.zip" | tee "$RUNNER_TEMP/hashes.txt"
          A=$(sha256sum web-ext-artifacts/*.zip | awk '{print $1}')
          B=$(sha256sum "$RUNNER_TEMP/first.zip" | awk '{print $1}')
          if [ "$A" != "$B" ]; then
            echo "::error::Build is not reproducible: two clean builds produced different zips"
            exit 1
          fi
          echo "Reproducibility verified: identical hash across two clean builds"

      - name: web-ext lint (official AMO validator)
        # The build is warning-clean today; keep it that way so AMO review is never
        # blocked by drift. Downgrade this flag only with a very good reason.
        run: npx --yes web-ext lint --source-dir=dist --warnings-as-errors

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orbis-unsigned
          path: web-ext-artifacts/*.zip
          retention-days: 30

  domains:
    name: Domain database validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate domain JSON
        run: node scripts/validate-json.mjs
      - name: Domain database tests
        run: npx vitest run test/domain-db.test.ts test/matcher.test.ts
