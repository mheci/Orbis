name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository link hygiene
        run: node scripts/check-links.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node == '20'
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build, verify & package
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify manifest, domain JSON and repository links
        run: npm run verify

      - name: Package
        run: npm run package

      - name: web-ext lint (official AMO validator)
        # The build is warning-clean today; keep it that way so AMO review is never
        # blocked by drift. Downgrade this flag only with a very good reason.
        run: npx --yes web-ext lint --source-dir=dist --warnings-as-errors

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: g-container-unsigned
          path: web-ext-artifacts/*.zip
          retention-days: 30

  domains:
    name: Domain database validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate domain JSON
        run: node scripts/validate-json.mjs
      - name: Domain database tests
        run: npx vitest run test/domain-db.test.ts test/matcher.test.ts
