name: Scheduled maintenance

# Autonomous health checks. The extension makes no network requests and pins no
# remote data, so it cannot break from the outside — but the toolchain, the AMO
# validation rules and Firefox itself all move underneath it. This job proves
# the project still builds and still passes Mozilla's validator on a clean
# machine, without anyone having to remember to check.

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Build health & AMO validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Full gate (lint, typecheck, test, verify, package)
        id: gate
        run: npm run ci

      - name: AMO validator (current rules)
        id: amo
        run: npx --yes web-ext lint --source-dir=dist --warnings-as-errors

      - name: Audit dev dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Open an issue if the scheduled build broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled maintenance build failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
            });
            const already = existing.find((i) => i.title === title);
            const body = [
              'The weekly maintenance run failed on a clean checkout.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The extension itself makes no network requests, so this is almost',
              'certainly toolchain drift or a new AMO validation rule rather than a',
              'regression in G-Container. Check the failing step before assuming a bug.',
            ].join('\n');
            if (already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: already.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci', 'triage'],
              });
            }
