name: Release

# Orbis is distributed exclusively through GitHub Releases. The add-on is
# signed with Mozilla's signing service (web-ext sign) so Firefox accepts it
# on release builds, but nothing is ever submitted or published to
# addons.mozilla.org: --channel=unlisted requests a signature only.
#
# Because installs are self-hosted, updates are served from a Firefox update
# manifest (scripts/update-manifest.mjs) published to the gh-pages branch and
# served at https://mheci.github.io/Orbis/updates.json. The manifest is
# regenerated from the live release list on every tagged release, so it can
# never point at a download that does not exist.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.1)'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Full CI gate
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build and package
        run: npm run package

      - name: Sign with AMO signing service (unlisted — signature only, never published)
        id: sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "AMO credentials not configured — publishing unsigned artifact only."
            exit 0
          fi
          npx --yes web-ext sign \
            --source-dir=dist \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --channel=unlisted \
            --artifacts-dir=web-ext-artifacts

      - name: Verify signature structure of the signed XPI
        if: steps.sign.outcome == 'success'
        run: |
          XPI=$(ls web-ext-artifacts/*.xpi 2>/dev/null | head -n1 || true)
          if [ -z "$XPI" ]; then
            echo "::error::Signing step reported success but no .xpi was produced"
            exit 1
          fi
          if ! unzip -l "$XPI" | grep -q "META-INF/mozilla.rsa"; then
            echo "::error::Signed XPI is missing META-INF/mozilla.rsa — signature verification failed"
            exit 1
          fi
          echo "Signature verified: $(basename "$XPI")"

      - name: Rename signed XPI to the canonical artifact name
        if: steps.sign.outcome == 'success'
        run: |
          # AMO names the downloaded file after its upload UUID, e.g.
          # 3b298fb89a6740f880cd-2.0.2.xpi. Canonicalise it so the checksums,
          # release notes and INSTALL.md all agree on the artifact name.
          XPI=$(ls web-ext-artifacts/*.xpi 2>/dev/null | head -n1 || true)
          CANONICAL="orbis-${GITHUB_REF_NAME#v}-signed.xpi"
          if [ -n "$XPI" ] && [ "$(basename "$XPI")" != "$CANONICAL" ]; then
            mv "$XPI" "web-ext-artifacts/$CANONICAL"
          fi

      - name: Create source archives (deterministic)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar HEAD | gzip -n > "web-ext-artifacts/orbis-${VERSION}-source.tar.gz"
          git archive --format=zip HEAD > "web-ext-artifacts/orbis-${VERSION}-source.zip"

      - name: Generate SHA-256 checksums
        run: |
          cd web-ext-artifacts
          # xargs -r skips the whole command when no artifact matches, and
          # sort -u drops the source.zip duplicate that matches two globs, so
          # a signing-less run still produces a valid checksums file.
          ls orbis-*.zip orbis-*.xpi orbis-*-source.* 2>/dev/null | sort -u | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "notes<<EOF"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "**Install:** download the \`-signed.xpi\` below (signature verified) and open it in Firefox, or see [INSTALL.md](https://github.com/mheci/Orbis/blob/main/INSTALL.md)."
            echo ""
            echo "Verify the download: \`sha256sum -c SHA256SUMS.txt\` after saving it next to the artifacts."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Orbis ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            web-ext-artifacts/orbis-*.zip
            web-ext-artifacts/orbis-*.xpi
            web-ext-artifacts/orbis-*-source.tar.gz
            web-ext-artifacts/orbis-*-source.zip
            web-ext-artifacts/SHA256SUMS.txt
          # Signing is skipped when AMO credentials are absent, so the signed
          # XPI must be optional; the unsigned zip, checksums and source
          # archives are always required.
          fail_on_unmatched_files: false

  update-channel:
    name: Publish Firefox update manifest
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Regenerate updates.json from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-manifest.mjs --out "$RUNNER_TEMP/updates.json"
          UPDATES="$RUNNER_TEMP/updates.json" node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("src/manifest.json", "utf8"));
            const u = JSON.parse(fs.readFileSync(process.env.UPDATES, "utf8"));
            const gecko = m.browser_specific_settings?.gecko ?? {};
            if (u.id !== gecko.id) throw new Error(`id mismatch: ${u.id} vs ${gecko.id}`);
            if (!Array.isArray(u.versions) || u.versions.length === 0) throw new Error("no versions");
            for (const v of u.versions) {
              if (!/^\d+\.\d+\.\d+$/.test(v.version)) throw new Error(`bad version ${v.version}`);
              if (typeof v.update_link !== "string" || !v.update_link.includes("/releases/download/v")) {
                throw new Error(`bad update_link for ${v.version}`);
              }
              if (v.update_hash !== undefined && !v.update_hash.startsWith("sha256:")) {
                throw new Error(`bad update_hash for ${v.version}`);
              }
            }
            console.log(`update manifest OK (${u.versions.length} entries, newest ${u.versions[0].version})`);
          '

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WORK="$RUNNER_TEMP/pages"

          # Credentials travel through a credential helper rather than the
          # remote URL so the token can never leak into argv or git errors.
          export GIT_ASKPASS=/bin/true
          git config --global credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'

          # Bootstrap the orphan branch on first deploy; afterwards every push
          # is a plain fast-forward — this branch is never force-pushed.
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://github.com/$REPO.git" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init --initial-branch=gh-pages
            git -C "$WORK" remote add origin "https://github.com/$REPO.git"
          fi

          cp "$RUNNER_TEMP/updates.json" "$WORK/updates.json"
          touch "$WORK/.nojekyll"
          git -C "$WORK" add updates.json .nojekyll

          if git -C "$WORK" diff --cached --quiet; then
            echo "updates.json unchanged - nothing to publish"
            exit 0
          fi
          git -C "$WORK" -c user.name="mheci" \
            -c user.email="274998646+mheci@users.noreply.github.com" \
            commit -m "updates: publish manifest for ${GITHUB_REF_NAME}"
          git -C "$WORK" push origin gh-pages
