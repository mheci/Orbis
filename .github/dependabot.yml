version: 2
updates:
  # Dev dependencies only — the extension ships zero runtime dependencies, so
  # these never reach users. Grouped into one PR a week to keep the review
  # queue small enough for a single maintainer to stay on top of.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    # Wait before adopting a freshly published version. Compromised packages are
    # typically caught and yanked within days, so a cooldown converts "we were
    # the first to install the malicious release" into "we never installed it".
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: scope
    groups:
      dev-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Major bumps of the lint/test toolchain routinely need coordinated changes
    # across several packages (eslint 10 needs @eslint/js 10 AND a matching
    # typescript-eslint, for example), so an automated single-package major PR
    # can only ever fail `npm ci`. Those upgrades are deliberate maintenance
    # work, tracked as an issue instead of arriving as unmergeable noise.
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/firefox-webext-browser'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    # Wait before adopting a freshly published version. Compromised packages are
    # typically caught and yanked within days, so a cooldown converts "we were
    # the first to install the malicious release" into "we never installed it".
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
    labels:
      - dependencies
      - ci
