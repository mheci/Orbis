version: 2
updates:
  # Dev dependencies only — the extension ships zero runtime dependencies, so
  # these never reach users. Grouped into one PR a week to keep the review
  # queue small enough for a single maintainer to stay on top of.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: scope
    groups:
      dev-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
    labels:
      - dependencies
      - ci
