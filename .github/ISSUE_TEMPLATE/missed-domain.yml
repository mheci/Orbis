name: Missed or over-eager domain
description: A Google site was not contained, or a non-Google site was contained
title: '[domain]: '
labels: ['domains', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Domain reports are the most valuable contribution to this project.
        Please run the URL tester first: open Settings, then Diagnostics. It tells us exactly which rule matched.

  - type: dropdown
    id: kind
    attributes:
      label: What happened?
      options:
        - A Google site was not put in the container
        - A site that is not Google was put in the container
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact URL (remove anything private from the query string)
      placeholder: https://example.google.com/some/path
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: URL tester output
      description: Paste the result from Settings, then Diagnostics, then Test a URL
      placeholder: 'Normal browsing, reason: none'
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence of ownership
      description: For a missed address, how do we know Google owns it? WHOIS records, an official link, and so on.

  - type: input
    id: version
    attributes:
      label: G-Container version
      placeholder: '1.0.0'
    validations:
      required: true
